function card(c){return `<a class="card ${e(c.category)}" href="#/company/${encodeURIComponent(c.id)}"><strong>${e(c.name)} <span class="country">${e(c.country)} ↗</span></strong><small>${e(c.products)}</small></a>`}
function globalStatus(){const s=updates.summary;const failed=s?.newsFailed||s?.irFailed||s?.irPartial||s?.marketCapFailed;return `<div class="update-status ${failed?'warning':''}">最終取得試行：${e(formatDate(updates.lastAttemptAt))} ／ 最終取得成功：${e(formatDate(updates.lastSuccessAt))}${failed?' ／ 一部の情報を取得できていません':''}　<span>毎日7:00（日本時間）に更新予定</span></div>`}
function drawMap(){const companies=matchingCompanies(catalog.companies,filters);const stages=catalog.stages.filter(s=>filters.phase==='all'||s.phase===filters.phase);document.querySelector('#map-content').innerHTML=`<div class="map-wrapper"><div class="phase-strip">${['front','back'].filter(p=>stages.some(s=>s.phase===p)).map(p=>`<div class="phase ${p}" style="width:${stages.filter(s=>s.phase===p).length*261-16}px">${p==='front'?'FRONT END　前工程':'BACK END　後工程'} <span style="float:right">工程の流れ →</span></div>`).join('')}</div><div class="map">${stages.map(s=>`<section class="column"><div class="column-head"><span class="number">${String(catalog.stages.indexOf(s)+1).padStart(2,'0')}</span><h2>${e(s.name)}</h2><span class="arrow">→</span></div>${Object.entries(labels).filter(([key])=>filters.category==='all'||key===filters.category).map(([key,label])=>{const list=companies.filter(c=>c.category===key&&c.stageIds.includes(s.id));return `<div class="section-label"><span>${label}</span><span>${list.length}</span></div>${list.map(card).join('')||'<div class="empty">該当企業なし</div>'}`}).join('')}</section>`).join('')}</div></div><p class="note">↔ 横にスクロールして全工程を表示 ／ ${companies.filter(c=>c.stageIds.some(id=>stages.some(s=>s.id===id))).length} 社表示</p>`}
function home(){app.innerHTML=`<section class="hero"><div><div class="eyebrow">SEMICONDUCTOR VALUE CHAIN</div><h1>半導体のつながりを、ひと目で。</h1><p>製造工程から、装置・部品・材料の企業を探す。</p></div><div class="stats"><div class="stat"><b>${catalog.companies.length}</b><span>登録企業</span></div><div class="stat"><b>${catalog.stages.length}</b><span>製造工程</span></div><div class="stat"><b>3</b><span>企業カテゴリー</span></div></div></section>${globalStatus()}<div class="toolbar"><input id="search" type="search" aria-label="企業名・製品・国で検索" placeholder="⌕　企業名・製品・国で検索"><select id="phase" aria-label="工程範囲"><option value="all">すべての工程</option><option value="front">前工程</option><option value="back">後工程</option></select><select id="category" aria-label="企業カテゴリー"><option value="all">すべての企業</option>${Object.entries(labels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><div class="legend">${Object.entries(labels).map(([k,v])=>`<span><i class="dot ${k}"></i>${v}</span>`).join('')}</div></div><div id="map-content"></div><p class="note">企業の製品・工程分類は初期登録データです（要確認）。実際の製造では成膜・露光・エッチング・洗浄などを繰り返します。</p>`;const search=document.querySelector('#search');search.value=filters.query;search.oninput=event=>{filters.query=event.target.value;drawMap()};for(const key of ['phase','category']){const el=document.querySelector('#'+key);el.value=filters[key];el.onchange=event=>{filters[key]=event.target.value;drawMap()}}drawMap()}
function amount(n,unit){return Number.isFinite(n)?`${n.toLocaleString('ja-JP')} ${e(unit||'')}`:'未登録'}
function financePanel(c){const f=research.finance[c.id];if(!f)return `<section class="panel"><h2>半導体関連部門の売上・営業利益比率</h2><div class="metrics"><div class="metric"><span class="note">売上構成比</span><b>未確認</b></div><div class="metric"><span class="note">営業利益構成比</span><b>未確認</b></div></div><p class="note">対象部門・年度・出典を確認した数値のみ表示します。半導体関連部門の利益が開示されていない企業は、確認後「非開示」と表示します。</p></section>`;return `<section class="panel"><h2>半導体関連部門の売上・営業利益比率</h2><p class="note">対象年度：${e(f.period)} ／ 部門：${e(f.segment)} ／ 会計基準：${e(f.basis)}</p><div class="metrics">${[['sales','売上'],['operatingProfit','営業利益']].map(([key,label])=>{const m=f[key]||{};return `<div class="metric"><span class="note">${label}構成比</span><b>${e(percentage(m.segment,m.total,m.status))}</b><p>半導体関連部門：${amount(m.segment,f.unit)}<br>全社：${amount(m.total,f.unit)}</p></div>`}).join('')}</div><p class="note">${e(f.note||'')}<br>同じ期間・通貨・会計基準の部門金額÷全社金額。赤字や全社調整により、通常の構成比として解釈できない場合があります。</p>${sourceLink(f.sourceUrl,'出典資料')}<p class="note">確認日：${e(f.verifiedAt||'未確認')}</p></section>`}
function sharesPanel(c){const markets=comparableMarkets(research.markets,c.id);return `<section class="panel"><h2>製品シェアの比較</h2>${markets.length?markets.map(m=>`<h3>${e(m.product)}</h3><p class="note">${e(m.year)}年 ／ ${e(m.region)} ／ ${e(m.measure)} ／ 定義：${e(m.definition)}</p><div class="table-wrap"><table><thead><tr><th>メーカー</th><th>シェア</th></tr></thead><tbody>${[...m.rows].sort((a,b)=>(b.share??-1)-(a.share??-1)).map(r=>{const company=catalog.companies.find(x=>x.id===r.companyId);return `<tr><td>${company?`<a href="#/company/${encodeURIComponent(company.id)}">${e(company.name)}</a>`:e(r.name||'その他')}</td><td>${Number.isFinite(r.share)?`${r.share.toFixed(1)}%<div class="bar"><span style="width:${Math.min(100,Math.max(0,r.share))}%"></span></div>`:'未確認'}</td></tr>`}).join('')}</tbody></table></div><p>${sourceLink(m.sourceUrl,'シェア情報の出典')}</p><p class="note">${e(m.note||'')} ／ 確認日：${e(m.verifiedAt)}</p>`).join(''):'<p class="empty">出典付きのシェアデータは未登録です。</p>'}<p class="note">製品市場・対象年・地域・金額／台数の定義が同じデータを比較します。推定値や未確認の数値は表示しません。</p></section>`}
function statusText(s){if(!s||s.state==='unconfigured')return '<p class="note">自動収集の取得元は未設定です。</p>';if(s.state==='disabled')return '<p class="note">自動収集は停止しています。</p>';return `<p class="update-status ${['error','partial'].includes(s.state)?'warning':''}">${s.state==='error'?'取得失敗・前回の情報を保持':s.state==='partial'?'一部取得失敗':'取得成功'} ／ 最終取得試行：${e(formatDate(s.lastAttemptAt))} ／ 最終成功：${e(formatDate(s.lastSuccessAt))}${s.error?` ／ ${e(s.error)}`:''}</p>`}
function articleList(items){return items.length?[...items].sort((a,b)=>(b.publishedAt||b.retrievedAt||'').localeCompare(a.publishedAt||a.retrievedAt||'')).map(i=>`<article class="article"><p class="note">${i.publishedAt?e(formatDate(i.publishedAt)):'公表日未確認'} ／ ${e(i.publisher)}</p>${sourceLink(i.url,i.title)}<p class="note">${e(i.relevance||'')} ／ 取得：${e(formatDate(i.retrievedAt))}</p></article>`).join(''):'<p class="empty">掲載できる情報はありません。取得状態と公式情報をご確認ください。</p>'}

function profilePanel(c){
 const p=c.profile;
 if(!p)return '';
 const listing=c.listing||{};
 const reference=p.informationStatus!=='verified';
 return `<section class="panel"><h2>企業概要・業界内の立ち位置</h2><p class="profile-summary">${e(p.summary)}</p><div class="position-box"><h3>バリューチェーンでの役割</h3><p>${e(p.industryPosition)}</p></div><h3>主要な製品・技術分野</h3><div>${p.strengths.map(x=>`<span class="tag">${e(x)}</span>`).join('')}</div><dl class="company-facts"><div><dt>拠点国</dt><dd>${e(c.country)}</dd></div><div><dt>上場区分</dt><dd>${listing.status==='subsidiary'?'非上場のグループ企業':listing.status==='private'?'非上場':'上場銘柄情報を登録（現行状態は要確認）'}</dd></div>${listing.ticker?`<div><dt>銘柄 / 取引所</dt><dd>${e(listing.ticker)} / ${e(listing.exchange)}</dd></div>`:''}${listing.parent?`<div><dt>親会社・所属グループ</dt><dd>${e(listing.parent)}</dd></div>`:''}</dl><p class="note">${e(listing.note||'')}</p><div class="update-status ${reference?'warning':''}">${reference?'初期編集情報・最新の公式情報との照合待ち':`確認日：${e(p.verifiedAt)}`} ／ ${e(p.note||'')}</div><p>${sourceLink(p.sourceUrl,reference?'公式情報の確認先':'出典')}</p></section>`;
}
function marketCapPanel(c,u){
 const listing=c.listing||{};
 const m=u.marketCap;
 if(['private','subsidiary'].includes(listing.status))return `<section class="panel"><h2>時価総額</h2><div class="market-cap-value">対象外（独立上場なし）</div><p class="note">${e(listing.note||'')}<br>親会社や上場関連会社の時価総額を、この企業の数値として代用しません。</p></section>`;
 const hasValue=Number.isFinite(m?.value)&&m.value>0;
 return `<section class="panel"><div class="panel-heading"><h2>時価総額</h2><span class="tag">全社の株式価値</span></div><div class="market-cap-value">${e(formatMarketCap(m))}</div><p class="note">全社の株式時価総額です。半導体事業だけの評価額ではありません。</p>${m?statusText(m):'<p class="update-status">日次更新時に取得予定です。まだ値は取得できていません。</p>'}${hasValue?`<dl class="company-facts"><div><dt>通貨</dt><dd>${e(m.currency)}</dd></div><div><dt>取得日時</dt><dd>${e(formatDate(m.retrievedAt))}</dd></div><div><dt>算定基準日</dt><dd>${m.quoteDate?e(formatDate(m.quoteDate)):'取得元に明示なし'}</dd></div></dl>`:''}<p class="note">${e(m?.note||'無料の公開ページから参考値を取得します。ページ形式変更やアクセス制限時は前回の値を残します。')}</p>${m?.sourceUrl?sourceLink(m.sourceUrl,'CompaniesMarketCapの掲載値'):c.marketCapSource?sourceLink(`https://companiesmarketcap.com/${c.marketCapSource.slug}/marketcap/`,'時価総額の確認先'):''}</section>`;
}
function facilitiesPanel(c){
 const facilities=c.facilities||[];
 return `<section class="panel"><h2>主要な製造・開発拠点</h2><p class="note">代表的な拠点の参考情報です。全工場の一覧ではありません。研究開発拠点は製造工場と分けて表示します。</p>${facilities.length?`<div class="facility-grid">${facilities.map(f=>`<article class="facility"><div class="facility-type">${f.kind==='rd'?'研究開発拠点':f.status==='verified'?'製造拠点':'製造拠点候補'}</div><h3>${e(f.name)}</h3><p class="facility-location">${e(f.location)}</p><p>${e(f.function)}</p><span class="tag">${f.status==='verified'?'確認済み':'所在地・機能の最新照合待ち'}</span><p>${sourceLink(mapSearchUrl(f),'地図で検索')}　${sourceLink(f.sourceUrl,f.status==='verified'?'出典':'公式確認先')}</p>${f.verifiedAt?`<p class="note">確認日：${e(f.verifiedAt)}</p>`:''}</article>`).join('')}</div>`:'<p class="empty">確認可能な工場情報は未登録です。公式の拠点情報を確認後に追加します。</p>'}</section>`;
}

function detail(id){const c=catalog.companies.find(c=>c.id===id);if(!c){app.innerHTML='<h1>企業が見つかりません</h1><a href="#">マップへ戻る</a>';return}const u=updates.companies[c.id]||{};const disclosures=(research.disclosures[c.id]||[]).filter(x=>x.status==='verified');app.innerHTML=`<a class="back-link" href="#">← バリューチェーンに戻る</a><article class="detail"><section class="detail-head"><div class="eyebrow">COMPANY PROFILE</div><h1>${e(c.name)}</h1><span class="tag">${labels[c.category]}</span><span class="tag">${e(c.country)}</span><p>${e(c.products)}</p>${c.stageIds.map(id=>`<span class="tag">${e(catalog.stages.find(s=>s.id===id)?.name)}</span>`).join('')}<p>${sourceLink(c.website,'企業公式サイト')} ${c.irUrl?sourceLink(c.irUrl,'公式IR'):''}</p><p class="note">製品・工程分類：${e(c.verificationStatus)}</p></section>${profilePanel(c)}${marketCapPanel(c,u)}${facilitiesPanel(c)}${financePanel(c)}${sharesPanel(c)}<section class="panel"><h2>適時開示</h2>${articleList(disclosures)}<p class="note">正式な適時開示と確認できた資料を掲載します。ニュース記事や未確認のIR資料を適時開示として扱いません。</p></section><section class="panel"><h2>公式IR資料・更新情報</h2>${statusText(u.sources?.ir)}${articleList(u.ir||[])}<p class="note">公式IRから資料リンクを自動収集。資料の開示種別・公表日・財務数値は別途確認が必要です。</p></section><section class="panel"><h2>半導体事業に関連するニュース</h2>${statusText(u.sources?.news)}${articleList(u.news||[])}<p class="note">Google Newsの無料RSSから見出し・媒体・日時・リンクのみ取得。関連性は見出しから自動判定しています。本文は転載せず、有料記事の内容は取得しません。リンク先が有料記事の場合があります。</p>${sourceLink(`https://news.google.com/search?q=${encodeURIComponent(c.aliases.join(' OR ')+' 半導体')}&hl=ja&gl=JP&ceid=JP:ja`,'ニュースを検索')}</section></article>`;window.scrollTo(0,0)}
function route(){const m=location.hash.match(/^#\/company\/(.+)$/);try{m?detail(decodeURIComponent(m[1])):home()}catch{app.innerHTML='<h1>URLが正しくありません</h1><a href="#">戻る</a>'}}
async function load(name){const r=await fetch(`./data/${name}.json`,{cache:'no-cache'});if(!r.ok)throw Error(`データ取得失敗: ${name}`);return r.json()}
async function init(){try{[catalog,research,updates]=window.SEMI_ATLAS_DATA||await Promise.all(['catalog','research','updates'].map(load));window.addEventListener('hashchange',route);route();document.querySelector('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({catalog,research,updates},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='semi-atlas.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}catch(err){app.innerHTML=`<h1>データを読み込めませんでした</h1><p>${e(err.message)}</p><p>再読み込みしてください。ローカルでは npm start または生成した standalone.html を使ってください。</p>`}}
init();

</script></body></html>
