function globalStatus(){const s=updates.summary;const failed=s?.newsFailed||s?.irFailed||s?.irPartial||s?.marketCapFailed;return `<div class="update-status ${failed?'warning':''}">最終取得試行：${e(formatDate(updates.lastAttemptAt))} ／ 最終取得成功：${e(formatDate(updates.lastSuccessAt))}${failed?' ／ 一部の情報を取得できていません':''}　<span>毎日7:00（日本時間）に更新予定</span></div>`}

function stageLink(s){return `#/stage/${encodeURIComponent(s.id)}`}
function drawMap(){
 const matches=matchingCompanies(catalog.companies,filters);
 const stages=catalog.stages.filter(s=>filters.phase==='all'||s.phase===filters.phase);
 document.querySelector('#map-content').innerHTML=`<nav class="map-wrapper" aria-label="製造工程表"><div class="phase-strip">${['front','back'].filter(p=>stages.some(s=>s.phase===p)).map(p=>`<div class="phase ${p}" style="width:${stages.filter(s=>s.phase===p).length*231-16}px">${p==='front'?'FRONT END　前工程':'BACK END　後工程'} <span style="float:right">工程の流れ →</span></div>`).join('')}</div><div class="stage-flow">${stages.map(s=>{const related=companiesForStage(catalog.companies,s.id);return `<a class="stage-tile ${s.phase}" href="${stageLink(s)}"><span class="stage-number">${String(catalog.stages.indexOf(s)+1).padStart(2,'0')}</span><h2>${e(s.name)}</h2><p>${e(s.description||'')}</p><div class="stage-counts">${Object.entries(labels).map(([key,label])=>`<span>${key==='equipment'?'装置':key==='parts'?'部品':'材料'} <b>${related.filter(c=>c.category===key).length}</b></span>`).join('')}</div><span class="stage-cta">${related.length}社 · 工程ページへ ↗</span></a>`}).join('')}</div></nav><p class="note">左から右へ工程を表示しています。工程をクリックすると、装置・部品・材料メーカーを確認できます。 ↔ 横にスクロール</p>`;
 if(!stages.length)document.querySelector('#map-content').innerHTML='';
 const active=filters.query.trim()||filters.category!=='all'||filters.phase==='infrastructure';
 document.querySelector('#infrastructure-content').innerHTML=`<section class="panel"><h2>共通設備・インフラ・周辺領域</h2><p class="note">複数工程を支える設備と基板実装などの周辺領域を、製造工程の流れとは別に表示しています。</p><div class="company-grid">${catalog.infrastructure.map(t=>`<a class="card equipment" href="#/infrastructure/${encodeURIComponent(t.id)}"><strong>${e(t.name)} ↗</strong><small>${e(t.description)}</small><span class="tag">${companiesForInfrastructure(catalog.companies,t.id).length}社</span></a>`).join('')}</div></section>`;
 const result=matches.filter(c=>filters.phase==='all'||(filters.phase==='infrastructure'?(c.infrastructureIds||[]).length>0:c.stageIds.some(id=>stages.some(s=>s.id===id))));
 document.querySelector('#search-results').innerHTML=active?`<section class="panel"><h2>企業検索結果 <span class="tag">${result.length}社</span></h2><div class="company-grid">${result.map(c=>card(c)).join('')||'<p class="empty">条件に一致する企業がありません。</p>'}</div></section>`:'';
}
function home(){
 document.title='SEMI ATLAS | 半導体バリューチェーン';
 app.innerHTML=`<section class="hero"><div><div class="eyebrow">SEMICONDUCTOR VALUE CHAIN</div><h1>工程から、半導体のつながりを探す。</h1><p>前工程から後工程へ。各工程の装置・部品・材料メーカーをたどる。</p></div><div class="stats"><div class="stat"><b>${catalog.companies.length}</b><span>登録企業</span></div><div class="stat"><b>${catalog.stages.length}</b><span>工程ページ</span></div><div class="stat"><b>3</b><span>企業カテゴリー</span></div></div></section>${globalStatus()}<div class="toolbar"><input id="search" type="search" aria-label="企業名・製品・国で検索" placeholder="⌕　企業名・製品・国で検索"><select id="phase" aria-label="工程範囲"><option value="all">すべての工程・共通設備</option><option value="front">前工程</option><option value="back">後工程</option><option value="infrastructure">共通設備・周辺領域</option></select><select id="category" aria-label="企業カテゴリー"><option value="all">すべての企業</option>${Object.entries(labels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div id="map-content"></div><div id="infrastructure-content"></div><div id="search-results" aria-live="polite"></div><p class="note">工程表は表示用の分類です。実際の製造では成膜・露光・エッチング・洗浄等を繰り返します。企業・工程分類は初期登録情報です（要確認）。</p>`;
 const search=document.querySelector('#search');search.value=filters.query;search.oninput=event=>{filters.query=event.target.value;drawMap()};
 for(const key of ['phase','category']){const el=document.querySelector('#'+key);el.value=filters[key];el.onchange=event=>{filters[key]=event.target.value;drawMap()}}
 drawMap();
}
function notFound(message='ページが見つかりません'){
 document.title='ページが見つかりません | SEMI ATLAS';
 app.innerHTML=`<section class="panel"><h1>${e(message)}</h1><a class="source" href="#">工程表へ戻る</a></section>`;
}
function drawStageCompanies(stage){
 const scoped=companiesForStage(catalog.companies,stage.id);
 const filter=stageFilters[stage.id];
 const visible=matchingCompanies(scoped,filter);
 document.querySelector('#stage-companies').innerHTML=`<p class="note" role="status">${visible.length}社表示 / この工程の登録企業 ${scoped.length}社</p><div class="stage-company-groups ${filter.category!=='all'?'filtered':''}">${Object.entries(labels).filter(([key])=>filter.category==='all'||filter.category===key).map(([key,label])=>{const list=visible.filter(c=>c.category===key);return `<section class="panel stage-company-group ${key}"><h2><i class="dot ${key}"></i>${label} <span class="tag">${list.length}社</span></h2><div class="stage-company-list">${list.map(c=>card(c,stage.id)).join('')||'<p class="empty">条件に一致する企業がありません。</p>'}</div></section>`}).join('')}</div>`;
}
function stagePage(id){
 const stage=catalog.stages.find(s=>s.id===id);
 if(!stage){notFound('工程が見つかりません');return}
 document.title=`${stage.name} | SEMI ATLAS`;
 const index=catalog.stages.indexOf(stage);
 const prev=catalog.stages[index-1],next=catalog.stages[index+1];
 const related=companiesForStage(catalog.companies,id);
 const filter=stageFilters[id] ||= {query:'',category:'all'};
 app.innerHTML=`<nav class="breadcrumbs" aria-label="パンくず"><a href="#">工程表</a><span>›</span><span>${stage.phase==='front'?'前工程':'後工程'}</span><span>›</span><span aria-current="page">${e(stage.name)}</span></nav><section class="stage-hero"><div><div class="eyebrow">PROCESS ${String(index+1).padStart(2,'0')} / ${stage.phase==='front'?'FRONT END':'BACK END'}</div><h1>${e(stage.name)}</h1><p>${e(stage.description||'')}</p></div><div class="stage-total"><b>${related.length}</b><span>関連する登録企業</span></div></section><nav class="stage-navigation" aria-label="工程ページ一覧">${catalog.stages.map(s=>`<a class="${s.id===id?'active':''}" href="${stageLink(s)}" ${s.id===id?'aria-current="page"':''}>${e(s.name)}</a>`).join('')}</nav><div class="toolbar"><input id="stage-search" type="search" aria-label="この工程の企業を検索" placeholder="⌕　この工程の企業・製品を検索"><select id="stage-category" aria-label="この工程の企業カテゴリー"><option value="all">すべての企業</option>${Object.entries(labels).map(([key,label])=>`<option value="${key}">${label}</option>`).join('')}</select><span class="note">企業名をクリックすると企業詳細へ移動します。</span></div><div id="stage-companies" aria-live="polite"></div><nav class="stage-pagination" aria-label="前後の工程">${prev?`<a href="${stageLink(prev)}">← ${e(prev.name)}</a>`:'<span></span>'}<a href="#">工程表へ戻る</a>${next?`<a href="${stageLink(next)}">${e(next.name)} →</a>`:'<span></span>'}</nav><p class="note">同じ工程への分類は、特定企業間の納入・取引関係を示すものではありません。企業の製品・工程分類は初期登録データです（要確認）。</p>`;
 const search=document.querySelector('#stage-search');search.value=filter.query;search.oninput=event=>{filter.query=event.target.value;drawStageCompanies(stage)};
 const category=document.querySelector('#stage-category');category.value=filter.category;category.onchange=event=>{filter.category=event.target.value;drawStageCompanies(stage)};
 drawStageCompanies(stage);
}
function infrastructurePage(id){
 const topic=catalog.infrastructure.find(t=>t.id===id);
 if(!topic){notFound('共通設備の項目が見つかりません');return}
 document.title=`${topic.name} | SEMI ATLAS`;
 const scoped=companiesForInfrastructure(catalog.companies,id);
 const filter=stageFilters['infrastructure:'+id] ||= {query:'',category:'all'};
 app.innerHTML=`<nav class="breadcrumbs" aria-label="パンくず"><a href="#">工程表</a><span>›</span><span>共通設備・インフラ</span><span>›</span><span aria-current="page">${e(topic.name)}</span></nav><section class="stage-hero"><div><div class="eyebrow">SHARED INFRASTRUCTURE</div><h1>${e(topic.name)}</h1><p>${e(topic.description)}</p></div><div class="stage-total"><b>${scoped.length}</b><span>関連する登録企業</span></div></section><nav class="stage-navigation" aria-label="共通設備一覧">${catalog.infrastructure.map(t=>`<a href="#/infrastructure/${encodeURIComponent(t.id)}" class="${t.id===id?'active':''}" ${t.id===id?'aria-current="page"':''}>${e(t.name)}</a>`).join('')}</nav><div class="toolbar"><input id="infrastructure-search" type="search" aria-label="この項目の企業を検索" placeholder="企業名・製品を検索"><select id="infrastructure-category" aria-label="企業カテゴリー"><option value="all">すべての企業</option>${Object.entries(labels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div id="infrastructure-companies" aria-live="polite"></div><a class="back-link" href="#">← 工程表へ戻る</a><p class="note">分類は初期登録情報です（要確認）。同じ項目への分類は企業間の取引関係を示すものではありません。</p>`;
 const draw=()=>{const visible=matchingCompanies(scoped,filter);document.querySelector('#infrastructure-companies').innerHTML=`<p class="note" role="status">${visible.length}社表示 / 登録企業 ${scoped.length}社</p><div class="stage-company-groups ${filter.category!=='all'?'filtered':''}">${Object.entries(labels).filter(([k])=>filter.category==='all'||filter.category===k).map(([k,v])=>`<section class="panel"><h2>${v}</h2><div class="stage-company-list">${visible.filter(c=>c.category===k).map(c=>card(c,null,id)).join('')||'<p class="empty">条件に一致する企業がありません。</p>'}</div></section>`).join('')}</div>`};
 const search=document.querySelector('#infrastructure-search');search.value=filter.query;search.oninput=event=>{filter.query=event.target.value;draw()};
 const category=document.querySelector('#infrastructure-category');category.value=filter.category;category.onchange=event=>{filter.category=event.target.value;draw()};draw();
}
function amount(n,unit){return Number.isFinite(n)?`${n.toLocaleString('ja-JP')} ${e(unit||'')}`:'未登録'}
function financePanel(c){const f=research.finance[c.id];if(!f)return `<section class="panel"><h2>半導体関連部門の売上・営業利益比率</h2><div class="metrics"><div class="metric"><span class="note">売上構成比</span><b>未確認</b></div><div class="metric"><span class="note">営業利益構成比</span><b>未確認</b></div></div><p class="note">対象部門・年度・出典を確認した数値のみ表示します。半導体関連部門の利益が開示されていない企業は、確認後「非開示」と表示します。</p></section>`;return `<section class="panel"><h2>半導体関連部門の売上・営業利益比率</h2><p class="note">対象年度：${e(f.period)} ／ 部門：${e(f.segment)} ／ 会計基準：${e(f.basis)}</p><div class="metrics">${[['sales','売上'],['operatingProfit','営業利益']].map(([key,label])=>{const m=f[key]||{};return `<div class="metric"><span class="note">${label}構成比</span><b>${e(percentage(m.segment,m.total,m.status))}</b><p>半導体関連部門：${amount(m.segment,f.unit)}<br>全社：${amount(m.total,f.unit)}</p></div>`}).join('')}</div><p class="note">${e(f.note||'')}<br>同じ期間・通貨・会計基準の部門金額÷全社金額。赤字や全社調整により、通常の構成比として解釈できない場合があります。</p>${sourceLink(f.sourceUrl,'出典資料')}<p class="note">確認日：${e(f.verifiedAt||'未確認')}</p></section>`}
function sharesPanel(c){const markets=comparableMarkets(research.markets,c.id);return `<section class="panel"><h2>製品シェアの比較</h2>${markets.length?markets.map(m=>`<h3>${e(m.product)}</h3><p class="note">${e(m.year)}年 ／ ${e(m.region)} ／ ${e(m.measure)} ／ 定義：${e(m.definition)}</p><div class="table-wrap"><table><thead><tr><th>メーカー</th><th>シェア</th></tr></thead><tbody>${[...m.rows].sort((a,b)=>(b.share??-1)-(a.share??-1)).map(r=>{const company=catalog.companies.find(x=>x.id===r.companyId);return `<tr><td>${company?`<a href="#/company/${encodeURIComponent(company.id)}">${e(company.name)}</a>`:e(r.name||'その他')}</td><td>${Number.isFinite(r.share)?`${r.share.toFixed(1)}%<div class="bar"><span style="width:${Math.min(100,Math.max(0,r.share))}%"></span></div>`:'未確認'}</td></tr>`}).join('')}</tbody></table></div><p>${sourceLink(m.sourceUrl,'シェア情報の出典')}</p><p class="note">${e(m.note||'')} ／ 確認日：${e(m.verifiedAt)}</p>`).join(''):'<p class="empty">出典付きのシェアデータは未登録です。</p>'}<p class="note">製品市場・対象年・地域・金額／台数の定義が同じデータを比較します。推定値や未確認の数値は表示しません。</p></section>`}
function statusText(s){if(!s||s.state==='unconfigured')return '<p class="note">自動収集の取得元は未設定です。</p>';if(s.state==='disabled')return '<p class="note">自動収集は停止しています。</p>';return `<p class="update-status ${['error','partial'].includes(s.state)?'warning':''}">${s.state==='error'?'取得失敗・前回の情報を保持':s.state==='partial'?'一部取得失敗':'取得成功'} ／ 最終取得試行：${e(formatDate(s.lastAttemptAt))} ／ 最終成功：${e(formatDate(s.lastSuccessAt))}${s.error?` ／ ${e(s.error)}`:''}</p>`}
function articleList(items){return items.length?[...items].sort((a,b)=>(b.publishedAt||b.retrievedAt||'').localeCompare(a.publishedAt||a.retrievedAt||'')).map(i=>`<article class="article"><p class="note">${i.publishedAt?e(formatDate(i.publishedAt)):'公表日未確認'} ／ ${e(i.publisher)}</p>${sourceLink(i.url,i.title)}<p class="note">${e(i.relevance||'')} ／ 取得：${e(formatDate(i.retrievedAt))}</p></article>`).join(''):'<p class="empty">掲載できる情報はありません。取得状態と公式情報をご確認ください。</p>'}

function profilePanel(c){
 const p=c.profile;
 if(!p)return '';
 const listing=c.listing||{};
 const reference=p.informationStatus!=='verified';
 return `<section class="panel"><h2>企業概要・業界内の立ち位置</h2><p class="profile-summary">${e(p.summary)}</p><div class="position-box"><h3>バリューチェーンでの役割</h3><p>${e(p.industryPosition)}</p></div><h3>主要な製品・技術分野</h3><div>${p.strengths.map(x=>`<span class="tag">${e(x)}</span>`).join('')}</div><dl class="company-facts"><div><dt>拠点国</dt><dd>${e(c.country)}</dd></div><div><dt>上場区分</dt><dd>${listing.status==='unknown'?'未確認':listing.status==='subsidiary'?'非上場のグループ企業':listing.status==='private'?'非上場':'上場銘柄情報を登録（現行状態は要確認）'}</dd></div>${listing.ticker?`<div><dt>銘柄 / 取引所</dt><dd>${e(listing.ticker)} / ${e(listing.exchange)}</dd></div>`:''}${listing.parent?`<div><dt>親会社・所属グループ</dt><dd>${e(listing.parent)}</dd></div>`:''}</dl><p class="note">${e(listing.note||'')}</p><div class="update-status ${reference?'warning':''}">${reference?'初期編集情報・最新の公式情報との照合待ち':`確認日：${e(p.verifiedAt)}`} ／ ${e(p.note||'')}</div><p>${sourceLink(p.sourceUrl,reference?'公式情報の確認先':'出典')}</p></section>`;
}
function marketCapPanel(c,u){
 const listing=c.listing||{};
 const m=u.marketCap;
 if(listing.status==='unknown')return `<section class="panel"><h2>時価総額</h2><div class="market-cap-value">未確認</div><p class="note">${e(listing.note||'上場状態と取得元を確認後に設定します。')}</p></section>`;
 if(['private','subsidiary'].includes(listing.status))return `<section class="panel"><h2>時価総額</h2><div class="market-cap-value">対象外（独立上場なし）</div><p class="note">${e(listing.note||'')}<br>親会社や上場関連会社の時価総額を、この企業の数値として代用しません。</p></section>`;
 const hasValue=Number.isFinite(m?.value)&&m.value>0;
 return `<section class="panel"><div class="panel-heading"><h2>時価総額</h2><span class="tag">全社の株式価値</span></div><div class="market-cap-value">${e(formatMarketCap(m))}</div><p class="note">全社の株式時価総額です。半導体事業だけの評価額ではありません。</p>${m?statusText(m):'<p class="update-status">日次更新時に取得予定です。まだ値は取得できていません。</p>'}${hasValue?`<dl class="company-facts"><div><dt>通貨</dt><dd>${e(m.currency)}</dd></div><div><dt>取得日時</dt><dd>${e(formatDate(m.retrievedAt))}</dd></div><div><dt>算定基準日</dt><dd>${m.quoteDate?e(formatDate(m.quoteDate)):'取得元に明示なし'}</dd></div></dl>`:''}<p class="note">${e(m?.note||'無料の公開ページから参考値を取得します。ページ形式変更やアクセス制限時は前回の値を残します。')}</p>${m?.sourceUrl?sourceLink(m.sourceUrl,'CompaniesMarketCapの掲載値'):c.marketCapSource?sourceLink(`https://companiesmarketcap.com/${c.marketCapSource.slug}/marketcap/`,'時価総額の確認先'):''}</section>`;
}
function facilitiesPanel(c){
 const facilities=c.facilities||[];
 return `<section class="panel"><h2>主要な製造・開発拠点</h2><p class="note">代表的な拠点の参考情報です。全工場の一覧ではありません。研究開発拠点は製造工場と分けて表示します。</p>${facilities.length?`<div class="facility-grid">${facilities.map(f=>`<article class="facility"><div class="facility-type">${f.kind==='rd'?'研究開発拠点':f.status==='verified'?'製造拠点':'製造拠点候補'}</div><h3>${e(f.name)}</h3><p class="facility-location">${e(f.location)}</p><p>${e(f.function)}</p><span class="tag">${f.status==='verified'?'確認済み':'所在地・機能の最新照合待ち'}</span><p>${sourceLink(mapSearchUrl(f),'地図で検索')}　${sourceLink(f.sourceUrl,f.status==='verified'?'出典':'公式確認先')}</p>${f.verifiedAt?`<p class="note">確認日：${e(f.verifiedAt)}</p>`:''}</article>`).join('')}</div>`:'<p class="empty">確認可能な工場情報は未登録です。公式の拠点情報を確認後に追加します。</p>'}</section>`;
}

function detail(id,fromStageId,fromInfrastructureId){const c=catalog.companies.find(c=>c.id===id);if(!c){notFound('企業が見つかりません');return}document.title=`${c.name} | SEMI ATLAS`;const fromStage=c.stageIds.includes(fromStageId)?catalog.stages.find(s=>s.id===fromStageId):null;const fromInfrastructure=(c.infrastructureIds||[]).includes(fromInfrastructureId)?catalog.infrastructure.find(t=>t.id===fromInfrastructureId):null;const u=updates.companies[c.id]||{};const disclosures=(research.disclosures[c.id]||[]).filter(x=>x.status==='verified');app.innerHTML=`<a class="back-link" href="${fromStage?stageLink(fromStage):fromInfrastructure?'#/infrastructure/'+encodeURIComponent(fromInfrastructure.id):'#'}">← ${fromStage?e(fromStage.name)+'の工程ページへ戻る':fromInfrastructure?e(fromInfrastructure.name)+'へ戻る':'工程表へ戻る'}</a><article class="detail"><section class="detail-head"><div class="eyebrow">COMPANY PROFILE</div><h1>${e(c.name)}</h1><span class="tag">${labels[c.category]}</span><span class="tag">${e(c.country)}</span><p>${e(c.products)}</p>${c.stageIds.map(id=>`<a class="tag stage-tag" href="#/stage/${encodeURIComponent(id)}">${e(catalog.stages.find(s=>s.id===id)?.name)} ↗</a>`).join('')}${(c.infrastructureIds||[]).map(id=>`<a class="tag stage-tag" href="#/infrastructure/${encodeURIComponent(id)}">${e(catalog.infrastructure.find(t=>t.id===id)?.name)} ↗</a>`).join('')}<p>${sourceLink(c.website,'企業公式サイト')} ${c.irUrl?sourceLink(c.irUrl,'公式IR'):''}</p><p class="note">製品・工程分類：${e(c.verificationStatus)}</p></section>${profilePanel(c)}${marketCapPanel(c,u)}${facilitiesPanel(c)}${financePanel(c)}${sharesPanel(c)}<section class="panel"><h2>適時開示</h2>${articleList(disclosures)}<p class="note">正式な適時開示と確認できた資料を掲載します。ニュース記事や未確認のIR資料を適時開示として扱いません。</p></section><section class="panel"><h2>公式IR資料・更新情報</h2>${statusText(u.sources?.ir)}${articleList(u.ir||[])}<p class="note">公式IRから資料リンクを自動収集。資料の開示種別・公表日・財務数値は別途確認が必要です。</p></section><section class="panel"><h2>半導体事業に関連するニュース</h2>${statusText(u.sources?.news)}${articleList(u.news||[])}<p class="note">Google Newsの無料RSSから見出し・媒体・日時・リンクのみ取得。関連性は見出しから自動判定しています。本文は転載せず、有料記事の内容は取得しません。リンク先が有料記事の場合があります。</p>${sourceLink(`https://news.google.com/search?q=${encodeURIComponent(c.aliases.join(' OR ')+' 半導体')}&hl=ja&gl=JP&ceid=JP:ja`,'ニュースを検索')}</section></article>`;window.scrollTo(0,0)}
function route(){
 const route=parseRoute(location.hash);
 if(route.type==='stage')stagePage(route.id);
 else if(route.type==='infrastructure')infrastructurePage(route.id);
 else if(route.type==='company')detail(route.id,route.fromStage,route.fromInfrastructure);
 else if(route.type==='home')home();
 else notFound();
 window.scrollTo(0,0);
}
async function load(name){const r=await fetch(`./data/${name}.json`,{cache:'no-cache'});if(!r.ok)throw Error(`データ取得失敗: ${name}`);return r.json()}
async function init(){try{[catalog,research,updates]=window.SEMI_ATLAS_DATA||await Promise.all(['catalog','research','updates'].map(load));window.addEventListener('hashchange',route);route();document.querySelector('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({catalog,research,updates},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='semi-atlas.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}catch(err){app.innerHTML=`<h1>データを読み込めませんでした</h1><p>${e(err.message)}</p><p>再読み込みしてください。ローカルでは npm start または生成した standalone.html を使ってください。</p>`}}
init();

</script></body></html>
