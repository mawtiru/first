name: Daily data update and Pages
on:
  schedule:
    # 22:00 UTC = 07:00 JST the following day. GitHub may delay schedules.
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - 'sources.json'
      - '.github/workflows/daily.yml'
permissions:
  contents: read
concurrency:
  group: semi-atlas-pages
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065e # v5
        with:
          python-version: '3.12'
      - name: Verify data and collector
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/frontend.test.mjs
          python3 scripts/validate.py
      - name: Fetch free feeds
        id: collect
        continue-on-error: true
        run: python3 scripts/update.py
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo '::warning::All news feeds failed. Prior articles are retained; inspect per-company status.'
          echo 'News collection failed. Last successful articles are retained.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report data coverage
        run: |
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          summary = json.loads(Path('site/data/updates.json').read_text()).get('summary', {})
          if summary.get('marketCapFailed', 0):
              print(f"::warning::{summary['marketCapFailed']} market-cap pages failed. Previous values are retained or marked unavailable.")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('\n## Data collection coverage\n\n')
              for key, value in summary.items():
                  report.write(f'- {key}: {value}\n')
          PYREPORT
      - name: Save data snapshot
        run: |
          git add site/data/updates.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update daily semiconductor feeds [skip ci]'
            git push origin HEAD:main
          fi
      - name: Build static and offline versions
        run: python3 scripts/build.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Upload downloadable HTML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semi-atlas-offline
          path: site/standalone.html
          retention-days: 30
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
